<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <title>Países y Capitales</title>
    <link rel='stylesheet' href='ejercicio21.css'>   
    </head>
        <body>

        <h2>Seleccionar país y capital</h2>

        <!-- Lista países -->
        <select id="paises">
            <option value="Seleccione un país">Seleccione un país</option>
            <option value="Argentina">Argentina</option>
            <option value="Brasil">Brasil</option>
            <option value="Chile">Chile</option>
            <option value="Perú">Perú</option>
            <option value="México">México</option>
            <option value="Colombia">Colombia</option>
        </select>

        <!-- Lista capitales -->
        <select id="capitales">
            <option value="Seleccione una capital">Seleccione una capital</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Brasilia">Brasilia</option>
            <option value="Santiago">Santiago</option>
            <option value="Lima">Lima</option>
            <option value="Ciudad de México">Ciudad de México</option>
            <option value="Bogotá">Bogotá</option>
        </select>
        <script type="module" src="js/ejercicio21.js"></script>
        </body>
</html>
