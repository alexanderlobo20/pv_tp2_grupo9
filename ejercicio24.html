<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Botones de opción</title>
  <link rel= "stylesheet" href="css/ejercicio24.css"> 
</head>
<body>

  <div class="contenedor">
    <h2>Selecciona un lenguaje</h2>

    <label>
      <input type="radio" name="lenguaje" value="JavaScript"> 
      <span>JavaScript</span>
    </label>

    <label>
      <input type="radio" name="lenguaje" value="Python"> 
      <span>Python</span>
    </label>

    <label>
      <input type="radio" name="lenguaje" value="Java"> 
      <span>Java</span>
    </label>

    <p id="resultado">No seleccionaste nada</p>
  </div>
  <script type="module" src="js/ejercicio24.js"></script>
</body>
</html>
