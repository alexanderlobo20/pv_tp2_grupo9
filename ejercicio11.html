<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Ejercicio 11</title>
  </head>
  <body>
    <script>
      const kilometos = parseFloat(prompt('Kilómetros recorridos:'));
      const litros = parseFloat(prompt('Litros consumidos:'));

      let consumo = litros / kilometos;

      alert(`El consumo es de ${consumo.toFixed(2)} litros por kilometro`);
    </script>
  </body>
</html>
